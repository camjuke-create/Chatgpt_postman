name: Fix Vercel rootDirectory

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLIENT_PORTAL_REPO_ID: 1264499739
    steps:
      - name: Get current project state
        id: state
        env:
          VERCEL_TOKEN: ${{ secrets.NEW_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          # Project ID known from previous diagnostic run
          PROJECT_ID="prj_kgGLeYSgHKKuwGnqI1SobtF39SRf"
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT

          STATE=$(curl -s "https://api.vercel.com/v9/projects/$PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "Current state:"
          echo "$STATE" | jq '{name: .name, rootDirectory: .rootDirectory, repo: (.link.repo // "null"), repoId: (.link.repoId // "null")}'

      - name: Clear rootDirectory only
        env:
          VERCEL_TOKEN: ${{ secrets.NEW_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          PROJECT_ID="${{ steps.state.outputs.project_id }}"

          # PATCH only rootDirectory — no link field (API rejects mixed patches)
          RESULT=$(curl -s -X PATCH "https://api.vercel.com/v9/projects/$PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": null}')

          echo "Patch rootDirectory=null response:"
          echo "$RESULT" | jq '{name: .name, rootDirectory: .rootDirectory, error: .error}'

      - name: Verify final state
        env:
          VERCEL_TOKEN: ${{ secrets.NEW_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          PROJECT_ID="${{ steps.state.outputs.project_id }}"
          STATE=$(curl -s "https://api.vercel.com/v9/projects/$PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "Final project state:"
          echo "$STATE" | jq '{name: .name, rootDirectory: .rootDirectory, repo: (.link.repo // "null"), productionBranch: (.link.productionBranch // "null")}'
