name: Fix Vercel rootDirectory

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLIENT_PORTAL_REPO_ID: 1264499739
    steps:
      - name: Get current project state
        id: state
        env:
          VERCEL_TOKEN: ${{ secrets.NEW_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          PROJECTS=$(curl -s "https://api.vercel.com/v9/projects?limit=100" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          PROJECT_ID=$(echo "$PROJECTS" | jq -r '.projects[] | select((.link.repo // "") | test("(?i)chatgpt")) | .id' | head -1)
          PROJECT_NAME=$(echo "$PROJECTS" | jq -r '.projects[] | select((.link.repo // "") | test("(?i)chatgpt")) | .name' | head -1)

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "No project linked to Chatgpt_postman found. Listing all projects:"
            echo "$PROJECTS" | jq -r '.projects[] | "\(.name) (id=\(.id)) rootDir=\(.rootDirectory // "null") repo=\(.link.repo // "no git")"'
            exit 1
          fi

          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT

          ROOTDIR=$(echo "$PROJECTS" | jq -r ".projects[] | select(.id == \"$PROJECT_ID\") | .rootDirectory // \"null\"")
          REPO=$(echo "$PROJECTS" | jq -r ".projects[] | select(.id == \"$PROJECT_ID\") | .link.repo // \"null\"")
          echo "Current state: name=$PROJECT_NAME id=$PROJECT_ID rootDirectory=$ROOTDIR repo=$REPO"

      - name: Clear rootDirectory and update git source
        env:
          VERCEL_TOKEN: ${{ secrets.NEW_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          PROJECT_ID="${{ steps.state.outputs.project_id }}"
          REPO_ID="$CLIENT_PORTAL_REPO_ID"

          # Try clearing rootDirectory with empty string
          RESULT=$(curl -s -X PATCH "https://api.vercel.com/v9/projects/$PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"rootDirectory\": \"\", \"link\": {\"type\": \"github\", \"repo\": \"camjuke-create/client-portal\", \"repoId\": $REPO_ID, \"productionBranch\": \"main\"}}")

          echo "Patch response:"
          echo "$RESULT" | jq '{name: .name, rootDirectory: .rootDirectory, repo: (.link.repo // "unchanged"), error: .error}'

      - name: Verify final state
        env:
          VERCEL_TOKEN: ${{ secrets.NEW_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          PROJECT_ID="${{ steps.state.outputs.project_id }}"
          STATE=$(curl -s "https://api.vercel.com/v9/projects/$PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "Final project state:"
          echo "$STATE" | jq '{name: .name, rootDirectory: .rootDirectory, repo: (.link.repo // "null"), productionBranch: (.link.productionBranch // "null")}'
