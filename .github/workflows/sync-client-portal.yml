name: Sync client-portal to dedicated repo

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"

      - name: Push client-portal-export to client-portal repo
        run: |
          git fetch origin client-portal-export
          # Remove the GITHUB_TOKEN extraheader set by actions/checkout — it overrides PAT credentials
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://${GH_PAT}@github.com/camjuke-create/client-portal.git" \
            refs/remotes/origin/client-portal-export:refs/heads/main --force
          echo "SUCCESS: code pushed to client-portal"
