name: Sync client-portal to dedicated repo

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"

      - name: Diagnose token and repo access
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "ERROR: GH_PAT secret is empty"
            exit 1
          fi
          echo "Token length: ${#GH_PAT}"
          TOKEN_PREFIX="${GH_PAT:0:4}"
          echo "Token prefix: $TOKEN_PREFIX"

          echo "--- Testing GitHub API auth ---"
          AUTH_RESP=$(curl -s -w "\nHTTP:%{http_code}" \
            -H "Authorization: token $GH_PAT" \
            "https://api.github.com/user")
          HTTP_CODE=$(echo "$AUTH_RESP" | tail -1 | sed 's/HTTP://')
          echo "Auth check HTTP status: $HTTP_CODE"
          echo "$AUTH_RESP" | head -1 | python3 -c "import sys,json; d=json.load(sys.stdin); print('Authenticated as:', d.get('login','?'))" 2>/dev/null || true

          echo "--- Testing client-portal repo access ---"
          REPO_RESP=$(curl -s -w "\nHTTP:%{http_code}" \
            -H "Authorization: token $GH_PAT" \
            "https://api.github.com/repos/camjuke-create/client-portal")
          REPO_HTTP=$(echo "$REPO_RESP" | tail -1 | sed 's/HTTP://')
          echo "Repo access HTTP status: $REPO_HTTP"
          echo "$REPO_RESP" | head -1 | python3 -c "import sys,json; d=json.load(sys.stdin); print('Repo:', d.get('full_name','?'), '| private:', d.get('private','?'), '| error:', d.get('message','none'))" 2>/dev/null || true

      - name: Push client-portal-export to client-portal repo
        run: |
          git fetch origin client-portal-export
          # Remove the GITHUB_TOKEN extraheader set by actions/checkout — it overrides PAT credentials
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://${GH_PAT}@github.com/camjuke-create/client-portal.git" \
            refs/remotes/origin/client-portal-export:refs/heads/main --force
          echo "SUCCESS: code pushed to client-portal"
