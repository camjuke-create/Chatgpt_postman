name: Sync client-portal to dedicated repo

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"

      - name: Push client-portal-export branch to client-portal repo
        run: |
          git fetch origin client-portal-export
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/camjuke-create/client-portal.git origin/client-portal-export:main --force
